name: Release V1.0.1 Refresh

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/release/v1.0.1-refresh.txt"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require V1.0.1 app metadata
        run: |
          grep -q 'versionName = "1.0.1"' app/build.gradle.kts
          grep -q 'versionCode = 2' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Build installable and release APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Prepare assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ScalperPro-V1.0.1-installable.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/ScalperPro-V1.0.1-release-unsigned.apk
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - name: Align V1.0.1 tag to validated build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1.0.1 "$GITHUB_SHA"
          git push --force origin refs/tags/v1.0.1

      - name: Replace V1.0.1 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Scalper Pro V1.0.1 by DrFXAi. Refreshed from the validated main build with the approved premium visual redesign: Neural Galaxy Home, premium navigation, News Intelligence, AI Chart Vision, Strategy/Quant Lab shell, Markets, Signals, Traderpedia/Academy and branded launcher icon. Also includes local-only historical CSV Backtest Lab and Scalper AI Gateway hardening. The installable APK uses CI debug signing; the release APK remains unsigned until a persistent production signing key is configured."
          gh release upload v1.0.1 dist/* --clobber
          gh release edit v1.0.1             --title "Scalper Pro V1.0.1"             --notes "$NOTES"
