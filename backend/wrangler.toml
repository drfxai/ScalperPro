name = "scalperpro-ai-gateway"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = false
preview_urls = false

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Set an explicitly verified provider model before enabling requests.
GEMINI_MODEL = ""
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ENABLE_NINEROUTER_FALLBACK = "false"

# Configure non-secret routing values after deploying:
# NINEROUTER_BASE_URL = "https://your-9router-tunnel.example/v1"
# NINEROUTER_SMART_MODEL = "your-smart-route-id"
# NINEROUTER_COMBO_MODEL = "your-combo-route-id"
#
# Store provider credentials only with Wrangler secrets:
# wrangler secret put GEMINI_API_KEY
# wrangler secret put NINEROUTER_API_KEY
