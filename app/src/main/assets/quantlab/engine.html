<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scalper Pro Quant Runtime</title>
</head>
<body>
<script src="quant-coder.js"></script>
<script>
(function () {
  function demoCandles() {
    var out = [];
    var px = 100;
    var start = 1704067200000;
    for (var i = 0; i < 320; i++) {
      var drift = Math.sin(i / 9) * 1.1 + Math.sin(i / 31) * 0.55 + 0.035;
      var open = px;
      px = Math.max(1, px + drift);
      var wick = 0.45 + Math.abs(Math.sin(i / 5)) * 0.55;
      out.push({
        t: start + i * 60000,
        o: open,
        h: Math.max(open, px) + wick,
        l: Math.min(open, px) - wick,
        c: px
      });
    }
    return out;
  }

  function splitWarnings(warnings) {
    var errors = [];
    var skips = [];
    (warnings || []).forEach(function (w) {
      if (/parse error|unexpected token|expected '/i.test(w)) errors.push(String(w));
      else skips.push(String(w));
    });
    return { errors: errors, skips: skips };
  }

  function nonNullCount(values) {
    var n = 0;
    for (var i = 0; i < (values || []).length; i++) {
      if (values[i] != null) n++;
    }
    return n;
  }

  window.scalperQuantAnalyze = function (source) {
    try {
      if (!window.dqQuantCoder) {
        return JSON.stringify({ ok: false, error: "QUANT_RUNTIME_NOT_READY" });
      }

      var started = Date.now();
      var program = window.dqQuantCoder.compile(String(source || ""));
      var split = splitWarnings(program.warnings || []);
      var candles = demoCandles();
      var result = window.dqQuantCoder.run(program, candles, null, 6000);

      var plotActivity = (result.plots || []).map(nonNullCount);
      var shapeActivity = (result.shapes || []).map(function (x) { return (x || []).length; });
      var runtimeMs = Date.now() - started;

      return JSON.stringify({
        ok: true,
        title: program.title || "Custom",
        pineVersion: program.pineVersion || 0,
        overlay: !!program.overlay,
        isStrategy: !!program.isStrategy,
        strategyOrders: program.strategyOrders || 0,
        lineCount: program.lineCount || 0,
        nodeCount: program.nodeCount || 0,
        plots: (program.plots || []).length,
        shapes: (program.shapes || []).length,
        candles: (program.candles || []).length,
        inputs: (program.inputs || []).map(function (input) {
          return {
            title: String(input.title || input.name || "Input"),
            defaultValue: input.def == null ? null : input.def
          };
        }),
        warnings: (program.warnings || []).map(String),
        parseErrors: split.errors,
        unsupported: split.skips,
        plotActivity: plotActivity,
        shapeActivity: shapeActivity,
        candleData: candles.map(function (c) {
          return {
            timeEpochSeconds: Math.floor(c.t / 1000),
            open: c.o,
            high: c.h,
            low: c.l,
            close: c.c
          };
        }),
        plotSeries: (program.plots || []).slice(0, 6).map(function (plot, index) {
          return {
            title: String(plot.title || ("Plot " + (index + 1))),
            color: String(plot.color || "#8B5CF6"),
            hidden: !!plot.hidden,
            style: String(plot.style || "line"),
            values: (result.plots[index] || []).map(function (value) {
              return value == null || !isFinite(value) ? null : Number(value);
            })
          };
        }),
        shapeSeries: (program.shapes || []).slice(0, 8).map(function (shape, index) {
          var resolved = (result.shapeCols || [])[index];
          var hits = (result.shapes[index] || []).slice(-500);
          return {
            title: String(shape.title || ("Signal " + (index + 1))),
            below: shape.below !== false,
            color: String(resolved || shape.color || "#F5B942"),
            glyph: String(shape.glyph || "▲"),
            text: String(shape.text || ""),
            indices: hits.map(function (value) {
              return Number(value);
            }).filter(function (value) {
              return isFinite(value) && value >= 0;
            })
          };
        }),
        labelSeries: (result.labels || [])
          .filter(function (label) {
            return label && !label.del && isFinite(Number(label.i));
          })
          .slice(-500)
          .map(function (label) {
            return {
              index: Number(label.i),
              text: String(label.text || ""),
              color: String(label.color || "#F5B942"),
              direction: String(label.dir || (label.up ? "up" : "down"))
            };
          }),
        runtimeMs: runtimeMs,
        engine: "DrFXQuant Quant Coder"
      });
    } catch (e) {
      return JSON.stringify({
        ok: false,
        error: String((e && e.message) || e || "QUANT_RUNTIME_ERROR")
      });
    }
  };
})();
</script>
</body>
</html>
